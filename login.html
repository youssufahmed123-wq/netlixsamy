<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Youssef Samy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <nav class="navbar container-fluid px-4 px-lg-5">
        <a class="brand" href="index.html">YOUSSEF SAMY</a>
        <a href="register.html" class="btn btn-danger">Create Account</a>
    </nav>
    <main class="auth-container">
        <div class="auth-box">
            <h1>Sign In</h1>
            <p class="auth-subtitle">Welcome back. Sign in to continue.</p>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">Sign In</button>
                <p id="loginMessage" class="mt-3" aria-live="polite"></p>
            </form>
            <div class="auth-footer">New here? <a href="register.html">Create an account</a></div>
        </div>
    </main>
    <footer class="auth-bottom text-center"><p>© 2026 Youssef Samy</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
